<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js"></script>
    <script>
        var vConsole = new window.VConsole();
    </script>

    <script type="importmap">
    {
        "imports": {
            "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.14.3/build/playcanvas.mjs"
        }
    }
    </script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; }
        #app { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <canvas id="app"></canvas>

    <script>
        // Wait 1 second for vConsole to wake up, THEN load the game
        setTimeout(() => {
            let script = document.createElement('script');
            script.type = 'module';
            script.src = 'game.js';
            document.body.appendChild(script);
        }, 1000);
    </script>
</body>
</html>
